name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  # ── Unit tests (no browser, no network) ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run unit tests
        run: pytest tests/unit -v

  # ── Build backend Docker image ───────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t agentqa-backend .

      - name: Verify image starts
        run: |
          docker run -d --name backend-test -p 8000:8000 agentqa-backend
          sleep 10
          curl -sf http://localhost:8000/health || (docker logs backend-test && exit 1)
          docker stop backend-test

  # ── Build frontend ───────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

  # ── Docker Compose integration smoke test ────────────────────────────
  compose-smoke:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo " Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became healthy"
          docker compose logs
          exit 1

      - name: Verify frontend responds
        run: curl -sf http://localhost:3000 > /dev/null

      - name: Tear down
        if: always()
        run: docker compose down

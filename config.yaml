# Website Security & Performance Assessment System — runtime configuration.
# Nothing in app/ hardcodes these values.

rules:
  # Case-insensitive: the repo directory is `Rules/`, which breaks on
  # case-sensitive filesystems if hardcoded lowercase.
  directory: Rules
  # Files without a "Control family:" marker are meta, not rules.
  meta_files: [00_README.md, 18_rule_object_schema.md,
               19_test_modes_safety.md, 20_framework_mapping.md]

browser:
  type: chromium          # CDP throttling is Chromium-only; others disable profiles
  headless: true
  timeout_ms: 30000
  navigation_timeout_ms: 45000
  viewport: {width: 1440, height: 900}
  locale: en-US
  ignore_https_errors: false   # TLS errors are EVIDENCE (NET-04), not noise

assessment:
  mode: passive           # passive | authenticated. Anything but passive needs
                          # an authorization_reference (GOV-02).
  authorization_reference: null
  max_pages: 20
  max_navigation_count: 20
  max_concurrent_contexts: 4
  max_concurrent_evaluations: 4   # bounded fan-out for a local 7B model
  timeout_seconds: 900
  stay_in_scope: true
  probe_well_known: true
  probe_error_page: true          # one benign 404, non-destructive
  collect_tls: true
  collect_dns: true
  run_axe: true

performance:
  enabled: true
  iterations: 3
  cooldown_seconds: 2
  per_profile_budget_seconds: 90
  profiles: [fast, 4g, 3g, slow]

network_profiles:
  fast: {download_mbps: 100.0, upload_mbps: 50.0,  latency_ms: 5}
  4g:   {download_mbps: 9.0,   upload_mbps: 3.0,   latency_ms: 85}
  3g:   {download_mbps: 1.6,   upload_mbps: 0.75,  latency_ms: 300}
  slow: {download_mbps: 0.4,   upload_mbps: 0.4,   latency_ms: 800}

behaviour:
  # User Behaviour Agent (app/behaviour/). Additive — the security assessment
  # ignores every key here.
  enabled: true
  max_actions: 60             # hard ceiling on dispatched actions per session
  max_steps_per_journey: 10   # one stubborn flow cannot eat the whole session
  max_navigations: 24         # counted in the SAME TrafficBudget as the scan
  pacing: 1.0                 # human pause multiplier; 0 = no pauses
  settle_quiet_ms: 260        # DOM must be still this long to call an action done
  settle_max_ms: 4500         # ceiling on waiting for that stillness
  max_elements: 220           # inventory cap per page
  keyboard_walk_steps: 12     # Tab presses sampled for focus visibility
  screenshots: true
  seed: null                  # set an integer to reproduce a run's pacing exactly
  timeout_seconds: 600
  # Ask the model for every individual step, not just the plan. OFF by default:
  # the model decides what the site IS and what journeys to walk (2 calls);
  # walking them is deterministic resolution against the observed elements.
  # Turning this on adds one round trip per action — against a local 7B that is
  # ~45s each, so a 60-action session becomes a 45-minute one.
  llm_decides_steps: false
  # A deadline on one model call. Past it the deterministic answer is used and
  # the report records `derived_by: heuristic`. This is not llm.timeout_seconds
  # (the HTTP timeout, which has retries behind it) — it is how long the agent
  # will wait before getting on with measuring.
  llm_call_timeout_seconds: 45

screenshots:
  enabled: true
  full_page: false

tracing:
  enabled: false          # off by default: traces can capture sensitive data

llm:
  provider: qwen
  model: qwen3-coder
  fallback_models: [qwen2.5-coder:7b, qwen2.5:7b]
  endpoint: http://localhost:11434
  temperature: 0.0
  timeout_seconds: 120
  max_retries: 2
  cache_dir: .cache/rule_interpretations
  # If the LLM is unreachable, evaluate deterministically and mark the rest
  # UNKNOWN rather than failing the run.
  required: false

storage:
  type: excel             # excel | postgres
  excel_path: artifacts/{assessment_id}/assessment_results.xlsx
  postgres_dsn: null

logging:
  level: INFO
  file: artifacts/{assessment_id}/logs/assessment.log
